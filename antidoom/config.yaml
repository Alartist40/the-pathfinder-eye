# AntiDoom config for Ministral-3B conversation model
# Adapted for pathfinder-eye's 3B model (smaller than AntiDoom's typical target,
# but the loop dynamics are the same at any scale)

model_name: "Mistral/Ministral-3B-Reasoning-2512"

generation:
  api_base_url: "http://127.0.0.1:8000/v1"
  api_key: "EMPTY"
  tokenizer_name: null

  # Use pathfinder-eye's own conversation logs as prompts, not a generic dataset.
  # Run build_antidoom_prompts.py first to produce this.
  input_jsonl: "pathfinder_conversations_prompts.jsonl"
  hf_dataset: null
  hf_split: null
  prompt_field: "prompt"  # each row: {"prompt": "full conversation transcript up to the point where the model is about to think"}
  max_prompts: null
  target_pairs: 500  # Smaller model = fewer pairs needed. Start low, bump if needed.
  target_pair_batch_size: 64

  generation_backend: "vllm"
  request_batch_size: 64
  vllm_dtype: "bfloat16"
  vllm_max_model_len: 4096  # Ministral has a shorter context window than the default target
  vllm_gpu_memory_utilization: 0.75  # Leave room for a 3B model on a humble GPU
  vllm_enable_prefix_caching: false
  vllm_trust_remote_code: true
  vllm_kwargs: {}

  prompt_template: |-
    {prompt}

    Think through this step by step and reply.
  system_prompt: "You are a friendly AI built into a wilderness robot called Pathfinder Eye. You talk naturally, help the user, and keep replies short."

  max_prompt_tokens: 1500
  max_new_tokens: 2000

  temperature: 0.01  # Very low to elicit loops
  temperatures: null
  top_p: 1.0
  top_k: 50
  min_p: 0.01
  top_logprobs: 20
  timeout: 600
  stop: ["</s>", "<|im_end|>"]

  # Looser thresholds for a smaller model that loops less aggressively
  repetition:
    min_repeats: 3    # default was 4
    max_period: 1024
    min_period: 1
    min_total_repeated: 40  # default was 60

  chosen_max_tokens: 10
  chosen_top_k: 30
  chosen_min_p: null
  chosen_min_decoded_chars: 1
  chosen_require_alnum: false
  chosen_skip_raw_token_substrings: []
  skip_decoded_shorter_than: null
  # Nothing to skip — all prompts are pathfinder-eye convos
  skip_eval_key_substrings: []

train:
  output_dir: "runs/pathfinder_lora"
  merged_output_dir: "runs/pathfinder_merged"
  merge_lora: true
  max_seq_length: 4096
  batch_size: 2          # smaller batch for a 3B on modest GPU
  gradient_accumulation_steps: 8
  num_epochs: 1
  learning_rate: 0.00002  # cranked slightly for a tiny model
  warmup_ratio: 0.1
  weight_decay: 0.01
  seed: 3407
  max_train_examples: 300

  # Light regularisation for a small model with fewer pairs
  rejected_regularisation_strength: 0.1
  chosen_regularisation_strength: 0.2
  source_balance_mode: "off"
  min_chosen_tokens: 1
  filter_rejected_stop_words: false

  lora_r: 128
  lora_alpha: 64
  lora_dropout: 0.0
  freeze_early_layers: false
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj", "lm_head"]
  load_in_4bit: false
  bf16: true

  lambda_mse_target: 0.05
  tau_mse_target: 0.5
  lambda_mse: 0.4
  clip_epsilon_logits: 2.0
  early_stopping_chosen_win: 0.4
  optim: paged_adamw_32bit